<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Contact Me</h2>
                    <h3 class="section-subheading text-muted">Have a project in mind or need help with data? I’d love to hear from you.</h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <form action="https://formspree.io/f/xgoazqdz" method="POST">
                        <input type="hidden" name="_subject" value="New message from your portfolio website">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="control-group form-group">
                                        <input type="text" name="name" class="form-control" placeholder="Your Name *" required>
                                    </div>
                                    <div class="control-group form-group">
                                        <input type="email" name="email" class="form-control" placeholder="Your Email *" required>
                                    </div>
                                    <div class="control-group form-group">
                                        <input type="tel" name="phone" class="form-control" placeholder="Your Phone">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="control-group form-group">
                                        <textarea name="message" class="form-control" placeholder="Your Message *" required></textarea>
                                    </div>
                                </div>
                                <div class="clearfix"></div>
                                <div class="col-lg-12 text-center">
                                    <button type="submit" class="btn btn-xl">Send Message</button>
                                </div>
                            </div>
                        </form>
                </div>
            </div>
        </div>
    </section>
